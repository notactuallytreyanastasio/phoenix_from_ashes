<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoenixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FD4F00"/>
      <stop offset="100%" style="stop-color:#F76B1C"/>
    </linearGradient>
  </defs>

  <!-- Light background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Top orange accent bar -->
  <rect width="1200" height="8" fill="url(#phoenixGrad)"/>

  <!-- Decorative graph visualization -->
  <g transform="translate(750, 100)">
    <!-- Connection lines -->
    <g stroke="#e5e7eb" stroke-width="2">
      <line x1="50" y1="80" x2="150" y2="40"/>
      <line x1="150" y1="40" x2="250" y2="100"/>
      <line x1="250" y1="100" x2="350" y2="60"/>
      <line x1="150" y1="40" x2="150" y2="140"/>
      <line x1="150" y1="140" x2="250" y2="180"/>
      <line x1="250" y1="100" x2="350" y2="160"/>
      <line x1="50" y1="80" x2="50" y2="180"/>
      <line x1="50" y1="180" x2="150" y2="220"/>
      <line x1="150" y1="220" x2="250" y2="180"/>
      <line x1="250" y1="180" x2="350" y2="240"/>
      <line x1="350" y1="160" x2="350" y2="240"/>
    </g>
    <!-- Nodes - using Phoenix orange and grays -->
    <circle cx="50" cy="80" r="12" fill="#FD4F00"/>
    <circle cx="150" cy="40" r="10" fill="#FD4F00" opacity="0.8"/>
    <circle cx="250" cy="100" r="10" fill="#6b7280"/>
    <circle cx="350" cy="60" r="12" fill="#FD4F00"/>
    <circle cx="150" cy="140" r="8" fill="#9ca3af"/>
    <circle cx="250" cy="180" r="10" fill="#FD4F00" opacity="0.7"/>
    <circle cx="350" cy="160" r="8" fill="#6b7280"/>
    <circle cx="50" cy="180" r="10" fill="#9ca3af"/>
    <circle cx="150" cy="220" r="8" fill="#6b7280"/>
    <circle cx="350" cy="240" r="12" fill="#FD4F00"/>
  </g>

  <!-- Phoenix bird icon -->
  <g transform="translate(80, 180)">
    <path d="M40 0 C55 20 70 40 55 70 C70 55 78 40 70 20 C85 40 92 70 70 105 C55 85 40 70 40 42 C40 70 28 85 14 105 C-7 70 0 40 14 20 C7 40 14 55 28 70 C14 40 28 20 40 0Z"
          fill="url(#phoenixGrad)"/>
  </g>

  <!-- Title -->
  <text x="80" y="340" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="700" fill="#1f2937">
    Phoenix From Ashes
  </text>

  <!-- Subtitle -->
  <text x="80" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6b7280">
    A Decision Graph Museum of Phoenix Framework
  </text>

  <!-- Divider line -->
  <rect x="80" y="420" width="120" height="4" rx="2" fill="#FD4F00"/>

  <!-- Stats -->
  <g transform="translate(80, 470)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="42" fill="#FD4F00" font-weight="700">175</text>
    <text x="0" y="28" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" font-weight="500">DECISIONS</text>

    <text x="140" y="0" font-family="system-ui, sans-serif" font-size="42" fill="#1f2937" font-weight="700">162</text>
    <text x="140" y="28" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" font-weight="500">CONNECTIONS</text>

    <text x="290" y="0" font-family="system-ui, sans-serif" font-size="42" fill="#1f2937" font-weight="700">37</text>
    <text x="290" y="28" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" font-weight="500">COMMITS</text>
  </g>

  <!-- Footer tagline -->
  <text x="80" y="580" font-family="system-ui, sans-serif" font-size="18" fill="#9ca3af">
    Explore the micro-stories behind Phoenix v0.1 → v1.0
  </text>

  <!-- Bottom border -->
  <rect y="622" width="1200" height="8" fill="url(#phoenixGrad)"/>
</svg>
